name: Feature Request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: enhancement
body:
  - type: markdown
    attributes:
    value: |
      Describe the feature clearly and explain the problem it solves.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or pain point are you facing?
      validations:
        required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution.
      validations:
        required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches?
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, examples, references, etc.