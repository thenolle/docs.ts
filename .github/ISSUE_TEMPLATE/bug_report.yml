name: Bug Report
description: Report a reproducible bug or regression.
title: "[BUG]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.  
        Please provide enough information to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version or commit are you using?
      placeholder: v0.0.1
      validations:
        required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      validations:
        required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
      validations:
        required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      validations:
        required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Optional screenshots, console output, or stack traces.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Other
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11, macOS 15, Ubuntu 24.04